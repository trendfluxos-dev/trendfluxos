name: Backend Deploy (Supabase)

# Ships backend changes alongside the Vercel frontend build.
#
# Frontend:  Lovable -> GitHub -> Vercel (automatic on push to main)
# Backend:   Lovable -> GitHub -> this workflow (migrations + edge functions)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token for the Supabase CLI
#   SUPABASE_DB_PASSWORD   - database password used by `supabase db push`
# Required repository variables:
#   SUPABASE_PROJECT_ID    - project ref (e.g. fookbowhuffalpidskqq)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Deploy edge functions"
        type: boolean
        default: true
      push_migrations:
        description: "Apply database migrations"
        type: boolean
        default: true

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations + Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - required credentials present
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; missing=1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::SUPABASE_PROJECT_ID variable is not set"; missing=1; }
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry-run migrations (show pending)
        run: supabase migration list --linked || true

      - name: Apply migrations
        if: ${{ github.event_name == 'push' || inputs.push_migrations }}
        run: supabase db push --linked --include-all

      - name: Deploy edge functions
        if: ${{ github.event_name == 'push' || inputs.deploy_functions }}
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            # `_shared` is a library folder, not a deployable function.
            case "$name" in _*) continue ;; esac
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Post-deploy database linter
        run: supabase inspect db outliers --linked || true
