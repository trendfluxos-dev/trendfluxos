name: Design System Tests

# Fail-fast CI gate: any broken design-system unit test blocks the merge.
# Runs the scoped vitest suite (Tfx* wrappers, token mapping, axe a11y,
# structural fingerprint, theme-tokens guard) so failures surface fast
# without waiting for the full test matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: design-system-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest (design-system)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run design-system unit tests
        run: bun run test:design-system