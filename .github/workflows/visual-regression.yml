name: Visual Regression

# Runs the DOM-fingerprint visual regression tests (home hero, founder banner,
# section ornaments, portfolio highlights) plus the Playwright pixel-diff
# visual project. Any accidental layout, spacing, typography or ordering
# change diffs the committed snapshots and fails the build.
#
# When an intentional visual change lands, review the snapshot diff and
# refresh with:
#   - Vitest fingerprints:  bunx vitest run -u src/test/*visual-regression*
#   - Playwright pixels:    bun run test:visual:update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Vitest DOM fingerprint snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run visual regression fingerprint tests
        run: bun run test:visual:fingerprint

      - name: Upload snapshot diffs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-visual-snapshots
          path: |
            src/test/__snapshots__/**
            **/__snapshots__/**
          retention-days: 14

  playwright-pixels:
    name: Playwright pixel-diff (visual-desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright visual project
        run: bun run test:visual

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 14

      - name: Upload pixel diffs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: test-results
          retention-days: 14