name: DB Security Lint

# Runs the Supabase database linter against the project's migrations on every
# pull request (and on pushes to main as a safety net). Any finding that is
# not explicitly listed in `.security/lint-baseline.json` fails the build.
#
# The lint runs against a local Supabase stack started from the committed
# migrations — no production credentials are needed, so this is safe to run
# on forks.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".security/lint-baseline.json"
      - "scripts/check-supabase-lint.mjs"
      - ".github/workflows/db-security.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".security/lint-baseline.json"
      - "scripts/check-supabase-lint.mjs"
      - ".github/workflows/db-security.yml"
  workflow_dispatch:

concurrency:
  group: db-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Supabase DB Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache the Supabase CLI binary across runs. The CLI is large and
      # `supabase/setup-cli` re-downloads it on every job otherwise. Keyed by
      # OS only because we pin `version: latest` — bumping to a pinned version
      # below will naturally invalidate the cache via the key suffix.
      - name: Cache Supabase CLI
        id: cache-supabase-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/supabase
            /opt/hostedtoolcache/supabase
          key: supabase-cli-${{ runner.os }}-latest
          restore-keys: |
            supabase-cli-${{ runner.os }}-

      - name: Log Supabase CLI cache status
        env:
          PRIMARY_KEY: supabase-cli-${{ runner.os }}-latest
          MATCHED_KEY: ${{ steps.cache-supabase-cli.outputs.cache-matched-key }}
        run: |
          if [ "$MATCHED_KEY" = "$PRIMARY_KEY" ]; then
            echo "✅ Supabase CLI cache RESTORED (exact key: $MATCHED_KEY)"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "↪️  Supabase CLI cache RESTORED via restore-keys (matched key: $MATCHED_KEY)"
          else
            echo "❌ Supabase CLI cache MISSED — CLI will be downloaded"
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Cache the Docker images that `supabase start` pulls (Postgres, GoTrue,
      # PostgREST, etc.). On a cold cache this saves nothing; on warm runs it
      # shaves multiple minutes off `supabase start`. The key includes a hash
      # of the migrations + workflow so unrelated PRs share the cache, but a
      # CLI/stack bump invalidates cleanly.
      - name: Cache Supabase Docker images
        id: cache-supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('.github/workflows/db-security.yml') }}
          restore-keys: |
            supabase-images-${{ runner.os }}-

      - name: Log Docker images cache status
        env:
          PRIMARY_KEY: supabase-images-${{ runner.os }}-${{ hashFiles('.github/workflows/db-security.yml') }}
          MATCHED_KEY: ${{ steps.cache-supabase-images.outputs.cache-matched-key }}
        run: |
          if [ "$MATCHED_KEY" = "$PRIMARY_KEY" ]; then
            echo "✅ Supabase Docker images cache RESTORED (exact key: $MATCHED_KEY)"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "↪️  Supabase Docker images cache RESTORED via restore-keys (matched key: $MATCHED_KEY)"
          else
            echo "❌ Supabase Docker images cache MISSED — images will be pulled and saved"
          fi

      - name: Restore Supabase Docker images
        if: steps.cache-supabase-images.outputs.cache-hit == 'true'
        run: |
          if [ -d /tmp/supabase-images ]; then
            for img in /tmp/supabase-images/*.tar; do
              [ -f "$img" ] || continue
              docker load -i "$img" || true
            done
          fi

      - name: Start local Supabase stack
        run: supabase start --exclude studio,inbucket,imgproxy,storage-api,realtime,edge-runtime,logflare,vector

      - name: Save Supabase Docker images for next run
        if: steps.cache-supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-images
          # Snapshot only the supabase/* images the stack actually pulled.
          # Each image is saved to its own tarball so the cache stays
          # incremental and partial restores remain usable.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^(public\.ecr\.aws/supabase/|supabase/)' \
            | sort -u \
            | while read -r image; do
                safe=$(echo "$image" | tr '/:' '__')
                docker save "$image" -o "/tmp/supabase-images/${safe}.tar" || true
              done

      - name: Run database linter (JSON)
        id: lint
        run: |
          mkdir -p reports
          # `--level info` returns every finding; the gate script filters
          # against the committed baseline.
          supabase db lint --level info --output json | tee reports/supabase-lint.json

      - name: Apply baseline gate
        env:
          SUPABASE_LINT_HTML_REPORT: reports/supabase-lint.html
        run: node scripts/check-supabase-lint.mjs reports/supabase-lint.json

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-lint-report
          path: reports/supabase-lint.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload HTML security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-lint-report-html
          path: reports/supabase-lint.html
          retention-days: 14
          if-no-files-found: ignore