name: SEO files validation

on:
  pull_request:
    paths:
      - "public/sitemap*.xml"
      - "public/robots.txt"
      - "scripts/validate-seo-files.mjs"
      - ".github/workflows/seo-validate.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate sitemap.xml + robots.txt
        run: node scripts/validate-seo-files.mjs