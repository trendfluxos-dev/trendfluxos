name: Token Compliance

# Every PR must pass the token-compliance gate:
#   1. `audit:tokens --check` — ratchet script that blocks new hardcoded
#      colors (hex, bg-white/black, gray-*/slate-*/zinc-*) against the
#      committed `.audit-tokens-baseline.json`.
#   2. `test:tokens` — vitest suite that enforces:
#        - no-rogue-colors    (source scan)
#        - theme-tokens       (canonical token values in src/index.css)
#        - tokens-mapping     (Tfx wrappers emit token-driven classes)
#        - contrast-audit     (WCAG contrast on token surfaces)
#
# Runs on every PR to main (no path filter) so a stray hardcoded color
# in any file blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: token-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Color-rogue audit (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check hardcoded-color budget
        run: node scripts/audit-tokens.mjs --check

  vitest:
    name: Token compliance (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run token-compliance vitest suite
        run: bun run test:tokens