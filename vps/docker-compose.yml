services:
  voice-clone:
    build: .
    image: voice-clone-studio:latest
    container_name: voice-clone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./voices:/app/voices
      - ./outputs:/app/outputs
      - xtts-cache:/root/.local/share/tts
    environment:
      - COQUI_TOS_AGREED=1
      # REQUIRED: bearer token enforced by app.py (fail closed without it).
      - XTTS_API_TOKEN=${XTTS_API_TOKEN:?set XTTS_API_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  xtts-cache: